<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auralia Collapsed Player</title>

  <style>
    :root {
      --bg: #08090d;
      --bg-soft: #101116;
      --white: #ffffff;
      --text-main: #f8f8f8;
      --text-muted: rgba(255, 255, 255, 0.32);
      --dot: rgba(255, 255, 255, 0.12);
      --wave: rgba(255, 255, 255, 0.58);
      --sheet-bg: #ffffff;
      --sheet-muted: #a9a9a9;
      --handle: #d1d1d1;

      --ease-main: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-sheet: 0 -24px 70px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050609;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      color: var(--text-main);
    }

    .app-shell {
      width: min(100vw, 430px);
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.035), transparent 32%),
        linear-gradient(180deg, #08090d 0%, #0c0d12 48%, #08090d 100%);
    }

    .app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      background-position: 0 8px;
      opacity: 0.72;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 2;
      height: 92px;
      padding: 24px 27px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(
        180deg,
        rgba(4, 5, 8, 0.78) 0%,
        rgba(4, 5, 8, 0.64) 55%,
        rgba(4, 5, 8, 0) 100%
      );
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      flex: 0 0 auto;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.1)),
        radial-gradient(circle at 50% 30%, #a7d9ed, #416b83);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 8px 24px rgba(0, 0, 0, 0.24);
      position: relative;
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 48% 28%, rgba(255, 255, 255, 0.95) 0 8%, transparent 9%),
        linear-gradient(135deg, transparent 42%, rgba(255, 255, 255, 0.72) 43% 48%, transparent 49%),
        radial-gradient(circle at 50% 58%, rgba(255, 255, 255, 0.78) 0 18%, transparent 19%);
      opacity: 0.7;
    }

    .brand-name {
      font-size: 32px;
      line-height: 1;
      letter-spacing: 6px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.9);
    }

    .time {
      font-size: 26px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.5px;
      color: rgba(255, 255, 255, 0.94);
      padding-top: 8px;
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: calc(100dvh - 118px);
      padding-top: 178px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wave-wrap {
      width: 82%;
      height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 7px;
      margin-bottom: 44px;
      opacity: 0.96;
    }

    .wave-bar {
      width: 5px;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.78),
        rgba(255, 255, 255, 0.46)
      );
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
      transform-origin: bottom center;
      animation: waveIdle 2.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * -0.055s);
    }

    @keyframes waveIdle {
      0%,
      100% {
        transform: scaleY(0.88);
        opacity: 0.68;
      }

      50% {
        transform: scaleY(1.08);
        opacity: 0.98;
      }
    }

    .content {
      text-align: center;
      padding: 0 28px;
      transform: translateY(-2px);
    }

    .title {
      margin: 0;
      font-size: 35px;
      line-height: 1.08;
      letter-spacing: -1.7px;
      font-weight: 850;
      color: #fff;
      white-space: nowrap;
    }

    .subtitle {
      margin: 16px 0 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 450;
      color: var(--text-muted);
    }

    .play-button {
      width: 92px;
      height: 92px;
      margin-top: 56px;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: #050609;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.28),
        inset 0 0 0 1px rgba(0, 0, 0, 0.04);
      transition:
        transform 260ms var(--ease-main),
        box-shadow 260ms ease,
        opacity 220ms ease;
    }

    .play-button:active {
      transform: scale(0.94);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.24),
        inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 7px;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid currentColor;
    }

    .bottom-sheet {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      height: 122px;
      background: var(--sheet-bg);
      border-radius: 28px 28px 0 0;
      box-shadow: var(--shadow-sheet);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 21px;
      color: var(--sheet-muted);
    }

    .sheet-handle {
      width: 37px;
      height: 4px;
      border-radius: 999px;
      background: var(--handle);
      margin-bottom: 15px;
    }

    .sheet-label {
      font-size: 15px;
      line-height: 1;
      color: #a7a7a7;
      letter-spacing: 0.5px;
    }

    .safe-blur {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 190px;
      z-index: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 9, 13, 0) 0%,
        rgba(8, 9, 13, 0.2) 36%,
        rgba(8, 9, 13, 0.45) 100%
      );
      pointer-events: none;
    }

    @media (min-width: 700px) {
      body {
        min-height: 100dvh;
        align-items: center;
        padding: 40px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 34%),
          #050609;
      }

      .app-shell {
        min-height: 900px;
        height: 900px;
        border-radius: 38px;
        box-shadow:
          0 34px 90px rgba(0, 0, 0, 0.46),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .bottom-sheet {
        border-radius: 28px 28px 0 0;
      }
    }

    @media (max-width: 380px) {
      .topbar {
        padding-left: 22px;
        padding-right: 22px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .brand-name {
        font-size: 28px;
        letter-spacing: 5px;
      }

      .time {
        font-size: 24px;
      }

      .stage {
        padding-top: 160px;
      }

      .wave-wrap {
        width: 84%;
        gap: 6px;
      }

      .wave-bar {
        width: 4px;
      }

      .title {
        font-size: 31px;
      }

      .play-button {
        width: 84px;
        height: 84px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="avatar" aria-hidden="true"></div>
        <div class="brand-name">Auralia</div>
      </div>

      <div class="time">0:00</div>
    </header>

    <section class="stage">
      <div class="wave-wrap" aria-hidden="true">
        <span class="wave-bar" style="--i: 1; height: 66px;"></span>
        <span class="wave-bar" style="--i: 2; height: 82px;"></span>
        <span class="wave-bar" style="--i: 3; height: 58px;"></span>
        <span class="wave-bar" style="--i: 4; height: 98px;"></span>
        <span class="wave-bar" style="--i: 5; height: 72px;"></span>
        <span class="wave-bar" style="--i: 6; height: 50px;"></span>
        <span class="wave-bar" style="--i: 7; height: 58px;"></span>
        <span class="wave-bar" style="--i: 8; height: 84px;"></span>
        <span class="wave-bar" style="--i: 9; height: 132px;"></span>
        <span class="wave-bar" style="--i: 10; height: 104px;"></span>
        <span class="wave-bar" style="--i: 11; height: 128px;"></span>
        <span class="wave-bar" style="--i: 12; height: 140px;"></span>
        <span class="wave-bar" style="--i: 13; height: 118px;"></span>
        <span class="wave-bar" style="--i: 14; height: 90px;"></span>
        <span class="wave-bar" style="--i: 15; height: 76px;"></span>
        <span class="wave-bar" style="--i: 16; height: 48px;"></span>
        <span class="wave-bar" style="--i: 17; height: 36px;"></span>
        <span class="wave-bar" style="--i: 18; height: 64px;"></span>
        <span class="wave-bar" style="--i: 19; height: 100px;"></span>
        <span class="wave-bar" style="--i: 20; height: 116px;"></span>
        <span class="wave-bar" style="--i: 21; height: 96px;"></span>
        <span class="wave-bar" style="--i: 22; height: 92px;"></span>
        <span class="wave-bar" style="--i: 23; height: 110px;"></span>
        <span class="wave-bar" style="--i: 24; height: 78px;"></span>
        <span class="wave-bar" style="--i: 25; height: 52px;"></span>
        <span class="wave-bar" style="--i: 26; height: 76px;"></span>
        <span class="wave-bar" style="--i: 27; height: 96px;"></span>
        <span class="wave-bar" style="--i: 28; height: 60px;"></span>
        <span class="wave-bar" style="--i: 29; height: 46px;"></span>
      </div>

      <div class="content">
        <h1 class="title">Monday Night Exhale</h1>
        <p class="subtitle">If — Bread</p>

        <button class="play-button" aria-label="播放">
          <span class="play-icon"></span>
        </button>
      </div>
    </section>

    <div class="safe-blur" aria-hidden="true"></div>

    <section class="bottom-sheet" aria-label="展开讲稿">
      <div class="sheet-handle"></div>
      <div class="sheet-label">上滑展开讲稿</div>
    </section>
  </main>
</body>
</html>
